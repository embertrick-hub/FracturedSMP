<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090710">
<meta name="description" content="The official Fractured SMP website: members, episodes, news and story.">
<title>FRACTURED SMP — Every world has a breaking point</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;600&display=swap">
<style>
:root{--bg:#090710;--panel:#14101f;--tx:#ece9f5;--mu:#9d97b5;--ac:#ff6a3d;--hd:'Cinzel',Georgia,serif;--bd:'Manrope',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:16px/1.65 var(--bd);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:-20%;z-index:0;opacity:.35;background:radial-gradient(40% 40% at 18% 22%,#4a2478,transparent 70%),radial-gradient(35% 35% at 82% 72%,#8a2f16,transparent 70%);animation:dr 30s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(5%,4%) scale(1.12)}}
#bgi{position:fixed;inset:0;z-index:0;background:center/cover;opacity:.3}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
h1,h2,h3{font-family:var(--hd);line-height:1.15}
h2{font-size:clamp(1.9rem,4vw,2.7rem);margin-bottom:28px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.top{position:fixed;top:0;left:0;right:0;z-index:45;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:linear-gradient(#090710ee,#09071000)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 1rem var(--hd);letter-spacing:.08em}
.brand img{width:36px;height:36px;border-radius:50%;object-fit:cover}
#burger{background:none;border:1px solid #ffffff2e;border-radius:10px;width:44px;height:44px;font-size:1.4rem;cursor:pointer}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(320px,85vw);z-index:40;background:#0d0a16f5;backdrop-filter:blur(12px);border-left:1px solid #ffffff1a;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:90px 28px;display:flex;flex-direction:column}
.open .drawer{transform:none}
.drawer a{padding:15px 4px;font:600 1.15rem var(--hd);text-decoration:none;border-bottom:1px solid #ffffff12}
.drawer a:hover{color:var(--ac);text-shadow:0 0 14px var(--ac)}
.scrim{position:fixed;inset:0;z-index:30;background:#0009;opacity:0;pointer-events:none;transition:opacity .3s}
.open .scrim{opacity:1;pointer-events:auto}
.view{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:110px 22px 70px;animation:fi .5s}
.view[hidden]{display:none!important}
@keyframes fi{from{opacity:0}}
#v-home{min-height:100vh;display:grid;place-content:center;justify-items:center;text-align:center;gap:16px}
.logo{width:clamp(120px,22vw,190px);aspect-ratio:1;object-fit:cover;border-radius:50%;box-shadow:0 0 60px -6px var(--ac),0 0 0 2px #ffffff22;animation:pu 4s ease-in-out infinite alternate}
@keyframes pu{to{box-shadow:0 0 90px 0 var(--ac),0 0 0 2px #ffffff40}}
h1{font-size:clamp(2.3rem,9vw,5.6rem);letter-spacing:.08em;text-shadow:0 0 30px #ff6a3d88}
.crack{width:min(560px,90%);height:auto}
.crack path{fill:none;stroke:var(--ac);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 5px var(--ac));animation:cr 2.4s .4s ease-out forwards}
@keyframes cr{to{stroke-dashoffset:0}}
#tag{font-size:1.25rem}
#sub{color:var(--mu)}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.btn{padding:12px 26px;border-radius:99px;background:var(--ac);color:#1a0a05;font-weight:600;text-decoration:none;box-shadow:0 0 24px -4px var(--ac)}
.btn.g{background:none;color:var(--tx);border:1px solid #ffffff33;box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
.card{position:relative;overflow:hidden;aspect-ratio:4/5;display:flex;align-items:flex-end;padding:20px;border-radius:14px;cursor:pointer;text-align:left;font:700 1.3rem var(--hd);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,var(--panel)),var(--panel));background-size:cover;background-position:center;transition:box-shadow .3s,transform .3s}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 55%,#000c)}
.card span{position:relative;z-index:1}
.card:hover,.card:focus-visible{box-shadow:0 0 32px -4px var(--c);transform:translateY(-4px)}
.tools{display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:none;border:1px solid #ffffff26;color:var(--mu);padding:7px 16px;border-radius:99px;cursor:pointer}
.chip.on{color:#fff;border-color:var(--ac);box-shadow:0 0 16px -2px var(--ac)}
select{background:var(--panel);color:var(--tx);border:1px solid #ffffff26;border-radius:8px;padding:8px 12px;font:inherit}
.ep{display:grid;grid-template-columns:min(260px,38%) 1fr;gap:16px;width:100%;text-align:left;align-items:center;background:#ffffff08;border:1px solid #ffffff14;border-radius:14px;padding:12px;margin-bottom:14px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.ep:hover,.ep:focus-visible{border-color:var(--ac);box-shadow:0 0 24px -8px var(--ac)}
.ep img,.ep i{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#1d1830}
.ep span{display:grid;gap:2px}
.ep b{font:700 1.15rem var(--hd)}
.ep time,.ep small{color:var(--mu)}
.post{background:#ffffff08;border:1px solid #ffffff14;border-radius:14px;padding:22px;margin-bottom:22px;max-width:760px}
.post img{max-width:100%;border-radius:10px;margin-bottom:14px}
.post time{color:var(--mu);font-size:.9rem}
.post p,#story p{white-space:pre-line;margin-top:10px}
#story article{margin-bottom:28px;max-width:70ch}
.rx{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.rx button{background:none;border:1px solid #ffffff26;border-radius:99px;padding:5px 12px;cursor:pointer}
.rx .on{border-color:var(--ac);box-shadow:0 0 12px -2px var(--ac)}
.empty{color:var(--mu)}
footer{position:relative;z-index:1;text-align:center;color:var(--mu);padding:24px}
.md{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#000c;padding:16px;animation:fi .25s}
.md[hidden]{display:none}
.box{position:relative;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:16px;border:1px solid var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 28%,var(--panel)),var(--panel));background-size:cover;background-position:center;box-shadow:0 0 70px -12px var(--c)}
.box::before{content:'';position:absolute;inset:0;background:linear-gradient(#09071040,#090710f2 62%)}
.in{position:relative;padding:min(38vh,240px) 28px 28px}
.in.vp{padding:52px 20px 20px}
.in h2{margin-bottom:18px}
dt{color:var(--mu);font-size:.9rem;margin-top:14px}
dd{font-size:1.1rem}
.x{position:absolute;top:10px;right:10px;z-index:2;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff40;background:#000a;font-size:1.4rem;cursor:pointer}
.pl{aspect-ratio:16/9;border-radius:10px;background:#000 center/cover}
.pl iframe{width:100%;height:100%;border:0;border-radius:10px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.bar a,.bar button{padding:10px 18px;border-radius:99px;border:1px solid #ffffff40;background:#ffffff12;text-decoration:none;cursor:pointer}
@media(max-width:560px){.ep{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,::before{animation:none!important;transition:none!important}.crack path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="bgi"></div><canvas id="fx"></canvas>
<header class="top">
 <a class="brand" href="#home"><img src="assets/logo.jpg" alt=""><span>FRACTURED SMP</span></a>
 <button id="burger" aria-label="Menu" aria-expanded="false" aria-controls="nav">☰</button>
</header>
<nav id="nav" class="drawer" aria-label="Main">
 <a href="#home">Home</a><a href="#members">Members</a><a href="#episodes">Episodes</a><a href="#news">News &amp; Announcements</a><a href="#story">Story</a>
</nav>
<div id="scrim" class="scrim"></div>
<main>
 <section class="view" id="v-home">
  <img class="logo" src="assets/logo.jpg" alt="Fractured SMP emblem">
  <h1>FRACTURED SMP</h1>
  <svg class="crack" viewBox="0 0 560 46" aria-hidden="true"><path pathLength="1" d="M0 24L90 14L150 30L230 8L300 34L380 12L450 28L560 20"/></svg>
  <p id="tag"></p><p id="sub"></p>
  <div class="btns"><a class="btn" href="#members">Meet the members</a><a class="btn g" href="#episodes">Watch episodes</a></div>
 </section>
 <section class="view" id="v-members" hidden><h2>Members</h2><div class="grid" id="mgrid"></div></section>
 <section class="view" id="v-episodes" hidden><h2>Episodes</h2>
  <div class="tools"><div id="chips" class="chips"></div>
  <select id="sort" aria-label="Sort episodes"><option value="new">Newest first</option><option value="old">Oldest first</option></select></div>
  <div id="eps"></div></section>
 <section class="view" id="v-news" hidden><h2>News &amp; Announcements</h2><div id="news"></div></section>
 <section class="view" id="v-story" hidden><h2>Story</h2><div id="story"></div></section>
</main>
<footer>Unofficial fan-made server website</footer>
<div class="md" id="md" hidden><div class="box" role="dialog" aria-modal="true"><button class="x" aria-label="Close">×</button><div id="mb"></div></div></div>
<script>
// Paste your Supabase project URL and anon key. The anon key is public by design; Row Level Security protects the data.
const CFG={url:'',key:''};
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ok=u=>/^(https?:\/\/|assets\/)[^\s"'()<>\\]+$/.test(u||'');
const U=u=>ok(u)?esc(u):'';
const C=c=>/^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#ff6a3d';
const fmt=d=>d?new Date(d).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'';
const yid=u=>((u||'').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/)||[])[1]||'';
const EM=['🔥','💜','👍','😮','😂'];
// Defaults: used until the database answers (or if it is not configured). Admins replace these via the database.
const D={
 site:{tagline:'Every world has a breaking point.',sub:'One world. Different perspectives.',bg:''},
 members:[
  {id:'embertrick',name:'EmberTrick',pvp:'Spear Mace',pvp2:'Sword',pers:'Sometimes calm, fast, fierce, empathetic, kind, strong and law-abiding.',info:'-',pic:'',c:'#ff6a3d'},
  {id:'ashblazex',name:'AshBlazeX',pvp:'Sword',pvp2:'TNT Minecart',pers:'Fierce, strong, powerful, not law-abiding and does anything for power.',info:'-',pic:'',c:'#8f9bb3'},
  {id:'soulscreamx',name:'SoulScreamX',pvp:'TNT Minecart',pvp2:'Sword',pers:'Kind, calm, decent, not the best at PvP and enjoys exploring.',info:'-',pic:'',c:'#3aa0ff'},
  {id:'lizzy',name:'lizzy___',pvp:'-',pvp2:'-',pers:'Intelligent and strategical.',info:'-',pic:'',c:'#f5f7ff'}],
 episodes:[],  // {id,title,date,players:[memberId],yt,thumb}
 news:[],      // {id,title,body,img,date}
 story:[]      // {title,body}: stays empty until admins add approved chapters
};
const S={p:'',o:'new'};
let RC={},mine={},uid;
try{mine=JSON.parse(localStorage.fm||'{}')}catch(e){}
try{uid=localStorage.fv||(localStorage.fv=crypto.randomUUID())}catch(e){uid=crypto.randomUUID()}
const api=(p,o={})=>fetch(CFG.url+'/rest/v1/'+p,{...o,headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'}});
const rpc=(f,b)=>api('rpc/'+f,{method:'POST',body:JSON.stringify(b||{})});
async function load(){
 if(!CFG.url)return;
 try{
  (await(await api('content_published?select=key,data')).json()).forEach(r=>{D[r.key]=r.data});
  RC={};(await(await rpc('get_reactions')).json()).forEach(r=>{(RC[r.post_id]=RC[r.post_id]||{})[r.emoji]=r.n});
 }catch(e){}
}
function renderHome(){
 $('tag').textContent=D.site.tagline||'';$('sub').textContent=D.site.sub||'';
 $('bgi').style.backgroundImage=ok(D.site.bg)?`url(${D.site.bg})`:'';
}
function renderMembers(){
 $('mgrid').innerHTML=D.members.map((m,i)=>`<button class="card" data-i="${i}" style="--c:${C(m.c)};${U(m.pic)?`background-image:url(${U(m.pic)})`:''}"><span>${esc(m.name)}</span></button>`).join('');
}
function renderEps(){
 const nm=id=>(D.members.find(m=>m.id===id)||{}).name;
 $('chips').innerHTML=[{id:'',name:'All'}].concat(D.members).map(m=>`<button class="chip${S.p===m.id?' on':''}" data-p="${esc(m.id)}">${esc(m.name)}</button>`).join('');
 const l=D.episodes.filter(e=>!S.p||(e.players||[]).includes(S.p)).sort((a,b)=>(new Date(b.date)-new Date(a.date))*(S.o==='old'?-1:1));
 $('eps').innerHTML=l.length?l.map(e=>{
  const t=U(e.thumb)||(yid(e.yt)?`https://img.youtube.com/vi/${yid(e.yt)}/hqdefault.jpg`:'');
  return `<button class="ep" data-id="${esc(e.id)}">${t?`<img src="${t}" alt="" loading="lazy">`:'<i></i>'}<span><b>${esc(e.title)}</b><time>${fmt(e.date)}</time><small>${(e.players||[]).map(nm).filter(Boolean).map(esc).join(', ')}</small></span></button>`;
 }).join(''):'<p class="empty">No episodes here yet.</p>';
}
function renderNews(){
 const l=[...D.news].sort((a,b)=>new Date(b.date)-new Date(a.date));
 $('news').innerHTML=l.length?l.map(n=>`<article class="post">${U(n.img)?`<img src="${U(n.img)}" alt="">`:''}<h3>${esc(n.title)}</h3><time>${fmt(n.date)}</time><p>${esc(n.body)}</p><div class="rx">${EM.map(e=>`<button data-p="${esc(n.id)}" data-e="${e}" class="${mine[n.id+'|'+e]?'on':''}">${e} <span>${(RC[n.id]||{})[e]||0}</span></button>`).join('')}</div></article>`).join(''):'<p class="empty">No announcements yet.</p>';
}
function renderStory(){
 $('story').innerHTML=D.story.length?D.story.map(s=>`<article><h3>${esc(s.title)}</h3><p>${esc(s.body)}</p></article>`).join(''):'<p class="empty">The story is still being written. Chapters will appear here as they are released.</p>';
}
const renderAll=()=>{renderHome();renderMembers();renderEps();renderNews();renderStory()};
function react(p,e){
 const k=p+'|'+e,on=!mine[k];
 on?mine[k]=1:delete mine[k];
 const c=RC[p]=RC[p]||{};c[e]=Math.max(0,(c[e]||0)+(on?1:-1));
 try{localStorage.fm=JSON.stringify(mine)}catch(x){}
 renderNews();
 if(CFG.url)rpc('react',{p_post:p,p_emoji:e,p_visitor:uid,p_on:on}).catch(()=>{});
}
function openM(h,bg,c){
 const m=$('md');
 m.firstElementChild.style.setProperty('--c',c||'#ffffff33');
 m.firstElementChild.style.backgroundImage=ok(bg)?`url(${bg})`:'';
 $('mb').innerHTML=h;m.hidden=false;document.body.style.overflow='hidden';m.querySelector('.x').focus();
}
function closeM(){$('md').hidden=true;$('mb').innerHTML='';document.body.style.overflow=''}
function play(e){
 if(!e)return;
 const id=yid(e.yt),t=U(e.thumb)||(id?`https://img.youtube.com/vi/${id}/hqdefault.jpg`:'');
 openM(`<div class="in vp"><h2>${esc(e.title)}</h2><div class="pl" id="pl"${t?` style="background-image:url(${t})"`:''}></div><div class="bar"><button id="w1">Watch here</button><a href="${U(e.yt)}" target="_blank" rel="noopener">Watch on YouTube</a><button id="fs">Fullscreen</button></div></div>`);
 const here=()=>{if(id&&!$('pl').querySelector('iframe'))$('pl').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="${esc(e.title)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`};
 $('w1').onclick=here;
 $('fs').onclick=()=>{here();const p=$('pl');(p.requestFullscreen||p.webkitRequestFullscreen||(()=>{})).call(p)};
}
const row=(k,v)=>`<dt>${k}</dt><dd>${esc(v||'-')}</dd>`;
$('mgrid').onclick=e=>{
 const b=e.target.closest('.card');if(!b)return;const m=D.members[b.dataset.i];
 openM(`<div class="in"><h2>${esc(m.name)}</h2><dl>${row('PvP method',m.pvp)+row('2nd PvP method',m.pvp2)+row('Personality',m.pers)+row('Special info',m.info)}</dl></div>`,m.pic,C(m.c));
};
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(b){S.p=b.dataset.p;renderEps()}};
$('sort').onchange=e=>{S.o=e.target.value;renderEps()};
$('eps').onclick=e=>{const b=e.target.closest('.ep');if(b)play(D.episodes.find(x=>String(x.id)===b.dataset.id))};
$('news').onclick=e=>{const b=e.target.closest('.rx button');if(b)react(b.dataset.p,b.dataset.e)};
$('md').onclick=e=>{if(e.target===$('md')||e.target.closest('.x'))closeM()};
const nav=o=>{document.body.classList.toggle('open',o);$('nav').inert=!o;$('burger').setAttribute('aria-expanded',o)};
$('burger').onclick=()=>nav(!document.body.classList.contains('open'));
$('scrim').onclick=()=>nav(false);
addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();nav(false)}});
function route(){
 const n=(location.hash||'#home').slice(1),v=$('v-'+n)?n:'home';
 document.querySelectorAll('.view').forEach(s=>s.hidden=s.id!=='v-'+v);
 nav(false);scrollTo(0,0);
}
// Ember particles (static when the visitor prefers reduced motion)
const cv=$('fx'),cx=cv.getContext('2d'),P=[];let W,H;
const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};addEventListener('resize',rs);rs();
for(let i=0;i<60;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,v:Math.random()*.5+.15,d:Math.random()*6});
function f(t){
 cx.clearRect(0,0,W,H);cx.shadowBlur=8;cx.shadowColor='#ff6a3d';
 for(const p of P){p.y-=p.v;p.x+=Math.sin(t/1500+p.d)*.3;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
  cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fillStyle=`rgba(255,${120+p.d*15|0},70,${.25+p.r/4})`;cx.fill()}
 if(!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(f);
}
f(0);
addEventListener('hashchange',route);
nav(false);renderAll();route();load().then(renderAll);
</script>
</body>
</html>
